name: Release

# Push a version tag (e.g. `v0.1.0`) to build installers for every platform and
# attach them to a draft GitHub Release. Run manually from the Actions tab to get
# the same builds as workflow artifacts without creating a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    permissions:
      contents: write # create the release and upload assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: ""
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin
          # The oldest supported Ubuntu gives the widest glibc compatibility.
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both macOS architectures are built on the same (Apple Silicon) runner.
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.args }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # Only tag pushes create a release; manual runs just upload artifacts.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: CBCT Viewer ${{ github.ref_name }}
          releaseBody: |
            Installers for Windows, macOS and Linux.

            These builds are not code-signed: Windows SmartScreen and macOS Gatekeeper
            will warn on first launch. See the README for how to open them.
          releaseDraft: true
          prerelease: false
          uploadWorkflowArtifacts: true
